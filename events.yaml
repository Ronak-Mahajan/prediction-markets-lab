# Kalshi KXRECSSNBER-27 settles on the NBER business cycle dating
# committee's announcement, which can arrive more than a year after the
# fact. Searching every recorded Polymarket and PredictIt slice on
# 2026-09-11 for "recession" or "nber" returns nothing that settles on that
# announcement, so the pair carried a literal
# "TODO-find-the-nber-market-id" as its second leg. A placeholder wearing a
# market key is worse than a missing pair: it counts in "N pairs" and can
# never be verified. The loader now refuses any key containing TODO/TBD/
# FIXME, so if it comes back it comes back as a rejected pair with a
# reason. To restore it, find a market that settles on the SAME NBER
# announcement -- not on a two-quarter GDP rule, which would make the
# basis a difference in the definition of "recession" rather than in price.
