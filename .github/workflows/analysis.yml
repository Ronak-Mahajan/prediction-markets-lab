name: analysis
on:
  schedule:
    - cron: "13 6 * * *"      # daily, after the overnight recorder and the settle job
  workflow_dispatch:
  push:
    branches: ["rebuild/**", "fix/**"]
    paths:
      - pmlab/**
      - screen.py
      - scripts/check_readme.py
      - README.md
      - requirements-analysis.txt
      - requirements-dev.txt
      - .github/workflows/analysis.yml
permissions:
  contents: write
concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4          # code plus the 117 main-branch snapshots
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          set -o pipefail
          python -m pip install -r requirements-dev.txt -r requirements-analysis.txt 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}

      - name: pytest
        run: |
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}

      # The data branch holds every snapshot recorder v2 writes. It does not
      # exist until the first v2 run, and its absence is the ordinary state of
      # a fresh branch: the replay then runs on data/ alone and stays green.
      - name: probe data branch
        id: probe
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the data branch does not exist yet; replaying data/ only"
          fi

      # Unlike the recorder and the settle job, the replay needs every blob,
      # so this is a full tip checkout with no sparse cone.
      #
      # KNOWN LIMIT, and it is a real one: this job re-reads the whole archive
      # every run. On a hosted runner a recorder-v1 snapshot costs about half a
      # second and a v2 snapshot (about 56,000 markets) a few seconds, so at
      # roughly twelve snapshots a day the replay outgrows the timeout below in
      # a couple of months, and the checkout outgrows the runner's disk in
      # about a year (the data branch grows 2-8 MB a day). The fix is an
      # incremental replay keyed on the per-blob sha256 already in
      # manifest.json, reusing the row in results/timeseries.csv for any blob
      # whose hash has not changed. That is not written yet; when this job
      # starts taking more than ten minutes, write it rather than raising the
      # timeout.
      - name: checkout data branch into ./archive
        if: steps.probe.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: data
          path: archive
          fetch-depth: 1

      - name: replay the archive
        run: |
          set -o pipefail
          python -m pmlab.replay --roots data archive/data 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}

      # Sync, then verify. --write repairs numbers in README.md that the fresh
      # results moved; the plain run afterwards is the gate, and it fails on
      # anything --write could not fix (a marker naming a key that no longer
      # exists, or all the markers deleted). A number edited by hand in a pull
      # request fails the ci workflow, which never runs --write.
      - name: sync README numbers to results
        run: |
          set -o pipefail
          python scripts/check_readme.py --write 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}

      - name: README numbers match results
        run: |
          set -o pipefail
          python scripts/check_readme.py --min-markers 10 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}

      - name: commit results to this branch
        if: github.ref != 'refs/heads/main'
        run: |
          set -e
          git config user.name "recorder"
          git config user.email "actions@users.noreply.github.com"
          git add results README.md
          if git diff --cached --quiet; then
            echo "results unchanged"; exit 0
          fi
          git commit -m "results: replay of the archive $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort || true; }
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed on attempt $i"; exit 0
            fi
            sleep $((5 * i))
          done
          echo "push failed after 5 attempts"; exit 1

      - name: save failure log
        if: failure() && github.ref != 'refs/heads/main'
        run: |
          mkdir -p .ci
          tail -c 60000 ci.log > .ci/last-failure-analysis.log 2>/dev/null || echo "no ci.log captured" > .ci/last-failure-analysis.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add .ci
          git commit -m "ci: failure log [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
