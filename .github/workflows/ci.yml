name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: install
        run: |
          set -o pipefail
          python -m pip install -r requirements-dev.txt 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}
      - name: pytest
        run: |
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}
      # The stronger checks -- every workflow parses, names a job, and cannot
      # push to main -- are in tests/test_workflows.py so they also run
      # locally. This step is the smoke test that the file the runner reads
      # is the file the tests read.
      - name: workflow files are valid YAML
        run: |
          set -o pipefail
          python - <<'EOF' 2>&1 | tee -a ci.log
          import glob, yaml
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              with open(f, encoding="utf-8") as fh:
                  d = yaml.safe_load(fh)
              assert "jobs" in d, f
              print("ok", f)
          EOF
          exit ${PIPESTATUS[0]}
      - name: upload failure log
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-log-test
          path: ci.log
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
