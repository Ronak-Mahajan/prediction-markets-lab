name: settle
on:
  schedule:
    - cron: "47 5 * * *"      # daily, after the overnight recorder runs
  workflow_dispatch:
    inputs:
      backfill:
        description: "sweep Kalshi settlements from 2026-08-23 (one-time)"
        type: boolean
        default: false
  push:
    branches: ["rebuild/**", "fix/**"]
    paths:
      - settle.py
      - pmlab/**
      - .github/workflows/settle.yml
permissions:
  contents: write
concurrency:
  group: data-branch          # shares the group with record.yml so pushes to data serialise
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4          # code (and the main-branch snapshots under data/)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: probe data branch
        id: probe
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout data branch into ./archive (partial, sparse)
        if: steps.probe.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: data
          path: archive
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: settlements

      # Nothing to settle before the first recorder run has created the data
      # branch. That is the ordinary state of a fresh branch, not a failure,
      # so the job reports it and stops green.
      - name: data branch missing
        if: steps.probe.outputs.exists == 'false'
        run: |
          echo "::notice::the data branch does not exist yet; the record workflow creates it"

      # Fetch only the snapshot days settle.py has not indexed yet.
      - name: materialise unindexed snapshots
        if: steps.probe.outputs.exists == 'true'
        run: |
          set -o pipefail
          DAYS=$(python -m pmlab.sparse archive)
          echo "unindexed days: $(echo "$DAYS" | wc -w)" | tee -a ci.log
          if [ -n "$DAYS" ]; then
            git -C archive sparse-checkout add $DAYS 2>&1 | tee -a ci.log
          fi

      - name: settle
        if: steps.probe.outputs.exists == 'true'
        run: |
          set -o pipefail
          FLAGS=""
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then FLAGS="--backfill"; fi
          python settle.py --archive archive --snapshots data $FLAGS 2>&1 | tee -a ci.log

      - name: commit and push to data
        if: steps.probe.outputs.exists == 'true'
        run: |
          set -e
          cd archive
          git config user.name "recorder"
          git config user.email "actions@users.noreply.github.com"
          git add --sparse -A settlements
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "settlements $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin data || { git rebase --abort || true; }
            if git push origin HEAD:data; then
              echo "pushed on attempt $i"; exit 0
            fi
            sleep $((5 * i))
          done
          echo "push failed after 5 attempts"; exit 1

      - name: save failure log to the code branch
        if: failure() && github.ref != 'refs/heads/main'
        run: |
          mkdir -p .ci
          tail -c 60000 ci.log > .ci/last-failure-settle.log 2>/dev/null || echo "no ci.log captured" > .ci/last-failure-settle.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add .ci
          git commit -m "ci: failure log [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
